<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Motu ❤️</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <audio id="myMusic" loop>
        <source src="romantic.mp3" type="audio/mpeg">
    </audio>

    <div id="overlay" onclick="startExperience()">
        <div class="glass-card animate-pulse">
            <h1 class="floating">🌹</h1>
            <h2>Touch the Rose, Motu</h2>
            <p>I have a secret for you...</p>
        </div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <div class="emoji-wrap">
            <span class="big-emoji animate-float">🌹</span>
            <span class="big-emoji animate-float-delay">💖</span>
        </div>
        
        <h1 id="headline" class="glow-text">Happy Rose Day, Jyoti!</h1>
        
        <div class="card-box">
            <p id="typed-text" class="message"></p>
        </div>

        <button id="confettiBtn" onclick="fireConfetti()">Click for a Hug! 🤗</button>

        <div id="countdown" class="timer"></div>
    </div>

    <script>
        function startExperience() {
            document.getElementById('myMusic').play().catch(e => console.log("Audio play failed"));
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            typeWriter();
            setInterval(createFloatingEmoji, 250);
            startTimer();
        }

        const emojis = ['🌹', '💖', '✨', '🌸', '🥰', '🍫', '🐷', '❤️'];
        function createFloatingEmoji() {
            const e = document.createElement('div');
            e.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            e.className = 'floating-emoji';
            e.style.left = Math.random() * 100 + 'vw';
            e.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(e);
            setTimeout(() => e.remove(), 5000);
        }

        const text = "To my dearest Jyoti... You are the most beautiful rose in the garden of my life. 🌹 My sweet Motu, I promise to keep you happy and blooming forever. Happy Rose Day! 💖✨";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typed-text").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 60);
            }
        }

        // CONFETTI BURST FUNCTION
        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
              confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#ff4d6d', '#ffffff', '#ffb3c1']
              });
              confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#ff4d6d', '#ffffff', '#ffb3c1']
              });

              if (Date.now() < end) {
                requestAnimationFrame(frame);
              }
            }());
        }

        function startTimer() {
            setInterval(() => {
                const now = new Date().getTime();
                const end = new Date("Feb 8, 2026 00:00:00").getTime();
                const diff = end - now;
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById("countdown").innerHTML = `${h}h ${m}m ${s}s left of Rose Day`;
            }, 1000);
        }
    </script>
</body>
</html>
